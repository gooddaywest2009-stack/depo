                time: 'вчера',
                unread: 0,
                messages: []

            {
                id: 5,
                user: { name: 'Анна М.', avatar: 'А', rating: 3.890, verified: false, online: true },

                time: 'вчера',
                unread: 0,
                messages: []
            }
        ];

        let activeChat = null;

        function renderChats() {
            const container = document.getElementById('chatsList');
            
            if (chats.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">💬</div>
                        <div>Нет сообщений</div>
                        <div style="font-size: 0.9rem; margin-top: 0.5rem;">Начните диалог с пользователем</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = chats.map(chat => `
                <div class="chat-item" onclick="openChat(${chat.id})">
                    <div class="chat-avatar ${chat.user.online ? 'online' : ''} ${chat.user.rating > 4.5 ? 'rating-high' : ''}">
                        ${chat.user.avatar}
                    </div>
                    <div class="chat-info">
                        <div class="chat-header">
                            <div class="chat-name">
                                ${chat.user.name}
                                ${chat.user.verified ? '<span style="color: var(--accent-gold);">✓</span>' : ''}
                                <span class="chat-rating">★ ${chat.user.rating.toFixed(2)}</span>
                            </div>
                            <div class="chat-time">${chat.time}</div>
                        </div>
                        <div class="chat-preview">${chat.lastMessage}</div>
                    </div>
                    <div class="chat-meta">
                        ${chat.unread > 0 ? `<div class="unread-badge">${chat.unread}</div>` : ''}
                        ${chat.read ? '<div class="read-status">✓✓</div>' : ''}
                    </div>
                </div>
            `).join('');
        }

        function openChat(chatId) {
            activeChat = chats.find(c => c.id === chatId);
            if (!activeChat) return;
            
            document.getElementById('chatScreen').classList.add('active');
            document.getElementById('chatName').innerHTML = `
                ${activeChat.user.name} 
                <span style="color: var(--accent-gold);">★ ${activeChat.user.rating.toFixed(3)}</span>
            `;
            document.getElementById('chatAvatar').textContent = activeChat.user.avatar;
            document.getElementById('chatAvatar').className = `chat-avatar ${activeChat.user.online ? 'online' : ''} ${activeChat.user.rating > 4.5 ? 'rating-high' : ''}`;
            
            renderMessages();
            
            // Сброс непрочитанных
            activeChat.unread = 0;
            renderChats();
        }

        function closeChat() {
            document.getElementById('chatScreen').classList.remove('active');
            activeChat = null;
        }

        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            
            if (!activeChat.messages || activeChat.messages.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 3rem 1rem; color: var(--text-secondary);">
                        <div style="font-size: 3rem; margin-bottom: 1rem;">👋</div>
                        <div>Начните разговор с ${activeChat.user.name}</div>
                        <div style="font-size: 0.85rem; margin-top: 0.5rem;">Рейтинг собеседника влияет на вес ваших действий</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = activeChat.messages.map(msg => `
                <div class="message ${msg.sent ? 'sent' : 'received'}">
                    ${msg.text}
                    <div class="message-time">${msg.time} ${msg.sent ? '✓' : ''}</div>
                </div>
            `).join('');
            
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text || !activeChat) return;
            
            const now = new Date();
            const time = now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');
            
            activeChat.messages.push({
                text: text,
                sent: true,
                time: time
            });
            
            activeChat.lastMessage = text;
            activeChat.time = 'только что';
            activeChat.read = false;
            
            input.value = '';
            renderMessages();
            renderChats();
            
            // Имитация ответа
            setTimeout(() => {
                if (activeChat) {
                    activeChat.messages.push({
                        text: 'Спасибо за сообщение! 👍',
                        sent: false,
                        time: time
                    });
                    activeChat.lastMessage = 'Спасибо за сообщение! 👍';
                    renderMessages();
                    renderChats();
                }
            }, 2000);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function newChat() {
            const name = prompt('Введите имя пользователя:');
            if (name) {
                const newId = chats.length + 1;
                chats.unshift({
                    id: newId,
                    user: { 
                        name: name, 
                        avatar: name[0].toUpperCase(), 
                        rating: (2.5 + Math.random() * 2).toFixed(3), 
                        verified: Math.random() > 0.5,
                        online: Math.random() > 0.3
                    },
                    lastMessage: 'Новый чат создан',
                    time: 'только что',
                    unread: 0,
                    messages: []
                });
                renderChats();
            }
        }

        // Инициализация
        renderChats();
    </script>
</body>
</html>'''
