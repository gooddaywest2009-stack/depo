    <script>
        // Данные
        let currentUser = JSON.parse(localStorage.getItem('ranknet_user')) || {
            name: 'Аноним',
            handle: '@anonymous',
            rating: 2.500,
            avatar: 'А',
            posts: 0,
            votes: 0
        };

        let posts = JSON.parse(localStorage.getItem('ranknet_posts')) || [
            {
                id: 1,
                author: { name: 'Мария К.', avatar: 'М', rating: 4.850, verified: true },
                content: 'Только что изучила формулу SRC! Затухание на высоких рейтингах — это гениально. С 4.8 до 4.9 сложнее, чем с 2.5 до 2.6 📊✨',
                timestamp: Date.now() - 3600000,
                score: 245,
                votes: { up: 42, down: 3 },
                userVote: null
            },
            {
                id: 2,
                author: { name: 'Алексей В.', avatar: 'А', rating: 4.920, verified: true },
                content: 'Новый модуль защиты от накруток готов! Теперь система автоматически замораживает подозрительную активность. Безопасность превыше всего! 🛡️',
                timestamp: Date.now() - 7200000,
                score: 189,
                votes: { up: 31, down: 1 },
                userVote: null
            },
            {
                id: 3,
                author: { name: 'Елена С.', avatar: 'Е', rating: 3.450, verified: false },
                content: 'Кто-нибудь понимает, как работает коэффициент W_user? При моём рейтинге 3.4 мой голос имеет вес около 1.0x 🤔',
                timestamp: Date.now() - 10800000,
                score: 67,
                votes: { up: 12, down: 5 },
                userVote: null
            }
        ];

        // Формула SRC
        function calculateRatingChange(rating, actionValue, voterRating) {
            const R_old = rating;
            const S_total = actionValue;
            const W_user = 0.5 + (voterRating / 5) * 1.5;
            const K_decay = 1.0;
            const denominator = 1 + Math.pow(R_old / 5, 2);
            const change = (S_total * W_user * K_decay) / denominator;
            
            return {
                change: change,
                newRating: Math.min(4.999, Math.max(0, R_old + change))
            };
        }

        function saveData() {
            localStorage.setItem('ranknet_user', JSON.stringify(currentUser));
            localStorage.setItem('ranknet_posts', JSON.stringify(posts));
        }

        function createPost() {
            const input = document.getElementById('postInput');
            const content = input.value.trim();
            
            if (!content) {
                alert('Введите текст поста');
                return;
            }
            
            const result = calculateRatingChange(currentUser.rating, 0.05, currentUser.rating);
            currentUser.rating = result.newRating;
            currentUser.posts++;
            
            const newPost = {
                id: Date.now(),
                author: { 
                    name: currentUser.name, 
                    avatar: currentUser.avatar, 
                    rating: currentUser.rating,
                    verified: currentUser.rating > 4.0
                },
                content: content,
                timestamp: Date.now(),
                score: Math.floor(currentUser.rating * 50),
                votes: { up: 1, down: 0 },
                userVote: 'up'
            };
            
            posts.unshift(newPost);
            saveData();
            
            input.value = '';
            renderPosts();
            alert(`Пост создан! Рейтинг +${result.change.toFixed(3)} ⭐`);
        }

        function votePost(postId, type) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;
            
            // Убираем предыдущий голос
            if (post.userVote === 'up') post.votes.up--;
            if (post.userVote === 'down') post.votes.down--;
            
            // Переключаем или убираем голос
            if (post.userVote === type) {
                post.userVote = null;
            } else {
                post.userVote = type;
                post.votes[type === 'up' ? 'up' : 'down']++;
                
                // Начисляем рейтинг автору за апвоут
                if (type === 'up') {
                    const voteWeight = 0.02 * (0.5 + (currentUser.rating / 5) * 1.5);
                    const result = calculateRatingChange(post.author.rating, voteWeight, currentUser.rating);
                    post.author.rating = result.newRating;
                }
            }
            
            currentUser.votes++;
            saveData();
            renderPosts();
        }

        function getTimeAgo(timestamp) {
            const seconds = Math.floor((Date.now() - timestamp) / 1000);
            if (seconds < 60) return 'только что';
            if (seconds < 3600) return `${Math.floor(seconds / 60)} мин`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)} ч`;
            return `${Math.floor(seconds / 86400)} д`;
        }

        function renderPosts() {
            const container = document.getElementById('postsContainer');
            document.getElementById('currentAvatar').textContent = currentUser.avatar;
            
            container.innerHTML = posts.map(post => `
                <article class="post-card">
                    <div class="post-header">
                        <div class="post-author">
                            <div class="author-avatar" style="background: ${post.author.rating > 4.5 ? 'linear-gradient(135deg, #ffd700, #ffed4e)' : ''}">
                                ${post.author.avatar}
                            </div>
                            <div class="author-info">
                                <h4>
                                    ${post.author.name}
                                    ${post.author.verified ? '<span style="color: var(--accent-gold);">✓</span>' : ''}
                                    <span class="author-rating">★ ${post.author.rating.toFixed(3)}</span>
                                </h4>
                                <div class="post-time">${getTimeAgo(post.timestamp)}</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="post-score">📊 Score: ${post.score}</div>
                    <div class="post-content">${post.content}</div>
                    
                    <div class="post-actions">
                        <div class="vote-section">
                            <button class="vote-btn ${post.userVote === 'up' ? 'active-up' : ''}" onclick="votePost(${post.id}, 'up')">▲</button>
                            <span class="vote-count" style="color: ${post.votes.up > post.votes.down ? 'var(--success)' : post.votes.down > post.votes.up ? 'var(--danger)' : 'var(--text-primary)'}">
                                ${post.votes.up - post.votes.down}
                            </span>
                            <button class="vote-btn ${post.userVote === 'down' ? 'active-down' : ''}" onclick="votePost(${post.id}, 'down')">▼</button>
                        </div>
                        <button class="action-btn">💬 ${Math.floor(Math.random() * 15)}</button>
                        <button class="action-btn">↗️</button>
                    </div>
                </article>
            `).join('');
        }

        // Инициализация
        renderPosts();
    </script>
</body>
</html>'''

print("✅ Страница ЛЕНТЫ создана")
